[package]
name = "vhs-archive"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Supervised Linux VHS capture with STK1160 frame repair and FFmpeg encoding"
license = "MIT"

[[bin]]
name = "vhs-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"

[profile.release]
lto = "thin"
strip = true
